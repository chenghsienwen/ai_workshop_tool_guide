<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 200" style="display:block;width:100%">
  <defs>
    <filter id="nshadow"><feDropShadow dx="0" dy="4" stdDeviation="8" flood-opacity="0.45"/></filter>
    <clipPath id="ncc"><rect x="60" y="30" width="360" height="140" rx="14"/></clipPath>
  </defs>
  <rect width="480" height="200" fill="#1a1a1a" opacity="0.7"/>
  <!-- Notification card -->
  <g filter="url(#nshadow)">
    <rect x="60" y="30" width="360" height="140" rx="14" fill="#2d2d2f"/>
  </g>
  <g clip-path="url(#ncc)">
    <rect x="60" y="30" width="360" height="140" fill="#2d2d2f"/>
    <!-- Left red accent bar -->
    <rect x="60" y="30" width="6" height="140" fill="#ff3b30"/>
    <!-- CrowdStrike icon (red square + falcon simplified) -->
    <rect x="82" y="50" width="48" height="48" rx="8" fill="#cc0000"/>
    <text x="106" y="84" text-anchor="middle" font-family="Arial Black,sans-serif" font-size="26" fill="white" font-weight="900">🦅</text>
    <!-- Notification title -->
    <text x="144" y="68" font-family="-apple-system,Helvetica Neue,sans-serif" font-size="13.5" fill="#e2e2e7" font-weight="700">CrowdStrike Falcon</text>
    <!-- Notification body -->
    <text x="144" y="90" font-family="-apple-system,Helvetica Neue,sans-serif" font-size="12" fill="#c8c8cc">「codex」已被防止與網路連線。</text>
    <text x="144" y="108" font-family="-apple-system,Helvetica Neue,sans-serif" font-size="11.5" fill="#8e8e93">應用程式：/usr/local/bin/codex</text>
    <text x="144" y="124" font-family="-apple-system,Helvetica Neue,sans-serif" font-size="11.5" fill="#8e8e93">原因：Firewall 政策封鎖對外連線。</text>
    <!-- Time -->
    <text x="400" y="52" text-anchor="end" font-family="-apple-system,Helvetica Neue,sans-serif" font-size="11" fill="#636366">剛才</text>
    <!-- Dismiss area hint -->
    <line x1="66" y1="148" x2="414" y2="148" stroke="#3a3a3c" stroke-width="1"/>
    <text x="240" y="163" text-anchor="middle" font-family="-apple-system,Helvetica Neue,sans-serif" font-size="11.5" fill="#636366">請聯繫 IT Help Desk 申請開放 codex 網路存取</text>
  </g>
  <rect x="60.5" y="30.5" width="359" height="139" rx="13.5" fill="none" stroke="#4a4a4c" stroke-width="1"/>
</svg>