<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 380" style="display:block;width:100%">
  <defs><clipPath id="gc"><rect width="620" height="380" rx="12"/></clipPath></defs>
  <g clip-path="url(#gc)">
    <rect width="620" height="380" fill="#202124"/>
    <!-- Tab bar -->
    <rect width="620" height="40" fill="#35363a"/>
    <rect x="8" y="6" width="200" height="28" rx="6" fill="#202124"/>
    <!-- Google favicon (G) -->
    <circle cx="26" cy="20" r="8" fill="#fff"/>
    <text x="26" y="25" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#4285f4" font-weight="700">G</text>
    <text x="44" y="24" font-family="-apple-system,Helvetica Neue,sans-serif" font-size="11" fill="#bdc1c6">錯誤 — accounts.google.com</text>
    <!-- Address bar -->
    <rect width="620" height="46" y="40" fill="#292a2d"/>
    <rect x="80" y="51" width="460" height="24" rx="6" fill="#303134"/>
    <text x="94" y="67" font-family="monospace,Courier,sans-serif" font-size="11" fill="#9aa0a6">https://accounts.google.com/oauth2/...</text>
    <line x1="0" y1="86" x2="620" y2="86" stroke="#3c3f43" stroke-width="1"/>
    <!-- Page content -->
    <rect x="0" y="86" width="620" height="294" fill="#ffffff"/>
    <!-- Google logo (text) -->
    <text x="310" y="148" text-anchor="middle" font-family="Product Sans,Arial,sans-serif" font-size="36" font-weight="700">
      <tspan fill="#4285f4">G</tspan><tspan fill="#ea4335">o</tspan><tspan fill="#fbbc05">o</tspan><tspan fill="#4285f4">g</tspan><tspan fill="#34a853">l</tspan><tspan fill="#ea4335">e</tspan>
    </text>
    <!-- Error icon -->
    <circle cx="310" cy="200" r="28" fill="#fce8e6" stroke="#f28b82" stroke-width="2"/>
    <text x="310" y="210" text-anchor="middle" font-family="Arial,sans-serif" font-size="26" fill="#d93025" font-weight="700">✕</text>
    <!-- Error heading -->
    <text x="310" y="258" text-anchor="middle" font-family="Google Sans,Arial,sans-serif" font-size="18" fill="#202124" font-weight="600">無法登入</text>
    <!-- Error body -->
    <text x="310" y="285" text-anchor="middle" font-family="Roboto,Arial,sans-serif" font-size="13" fill="#5f6368">你的瀏覽器或應用程式無法連線至 Google 帳號。</text>
    <text x="310" y="304" text-anchor="middle" font-family="Roboto,Arial,sans-serif" font-size="13" fill="#5f6368">請確認網路連線，或聯絡 IT 申請開放 Google OAuth。</text>
    <!-- Error code -->
    <text x="310" y="335" text-anchor="middle" font-family="monospace,Courier New,sans-serif" font-size="11" fill="#9aa0a6">Error 400: connection_blocked / oauth2_error</text>
  </g>
  <rect x="0.5" y="0.5" width="619" height="379" rx="11.5" fill="none" stroke="#3a3a3c" stroke-width="1"/>
</svg>