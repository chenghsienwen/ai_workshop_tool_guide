<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 400" style="display:block;width:100%">
  <defs><clipPath id="fc"><rect width="620" height="400" rx="12"/></clipPath></defs>
  <g clip-path="url(#fc)">
    <rect width="620" height="400" fill="#1c1c1e"/>
    <!-- Title bar -->
    <rect width="620" height="52" fill="#2d2d2f"/>
    <line x1="0" y1="52" x2="620" y2="52" stroke="#3a3a3c" stroke-width="1"/>
    <circle cx="20" cy="26" r="6.5" fill="#ff5f57"/>
    <circle cx="40" cy="26" r="6.5" fill="#ffbd2e"/>
    <circle cx="60" cy="26" r="6.5" fill="#28c840"/>
    <text x="310" y="32" text-anchor="middle" font-family="-apple-system,Helvetica Neue,sans-serif" font-size="13" fill="#c8c8cc" font-weight="500">Python 3.12</text>
    <!-- Toolbar -->
    <rect width="620" height="44" y="52" fill="#252527"/>
    <line x1="0" y1="96" x2="620" y2="96" stroke="#3a3a3c" stroke-width="1"/>
    <!-- Path bar: Applications > Python 3.12 -->
    <text x="20" y="79" font-family="-apple-system,Helvetica Neue,sans-serif" font-size="12" fill="#636366">應用程式</text>
    <text x="88" y="79" font-family="-apple-system,sans-serif" font-size="12" fill="#636366">›</text>
    <text x="100" y="79" font-family="-apple-system,Helvetica Neue,sans-serif" font-size="12" fill="#c8c8cc" font-weight="500">Python 3.12</text>
    <!-- Sidebar -->
    <rect x="0" y="96" width="152" height="304" fill="#222224"/>
    <line x1="152" y1="96" x2="152" y2="400" stroke="#3a3a3c" stroke-width="1"/>
    <!-- Sidebar items -->
    <text x="16" y="122" font-family="-apple-system,sans-serif" font-size="11" fill="#636366" font-weight="600">喜好項目</text>
    <text x="28" y="144" font-family="-apple-system,sans-serif" font-size="12.5" fill="#8e8e93">📁 應用程式</text>
    <text x="28" y="166" font-family="-apple-system,sans-serif" font-size="12.5" fill="#8e8e93">🏠 個人專屬</text>
    <text x="28" y="188" font-family="-apple-system,sans-serif" font-size="12.5" fill="#8e8e93">🖥 桌面</text>
    <text x="28" y="210" font-family="-apple-system,sans-serif" font-size="12.5" fill="#8e8e93">📥 下載項目</text>
    <!-- Main file area - grid view -->
    <!-- File 1: IDLE.app -->
    <g transform="translate(180,120)">
      <rect width="90" height="90" rx="8" fill="#2a2a2c"/>
      <rect x="15" y="12" width="60" height="48" rx="6" fill="#3776ab"/>
      <text x="45" y="46" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="white" font-weight="900">Py</text>
      <text x="45" y="76" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="11" fill="#8e8e93">IDLE.app</text>
    </g>
    <!-- File 2: Python Launcher -->
    <g transform="translate(290,120)">
      <rect width="90" height="90" rx="8" fill="#2a2a2c"/>
      <rect x="15" y="12" width="60" height="48" rx="6" fill="#ffd43b"/>
      <text x="45" y="44" text-anchor="middle" font-family="Arial,sans-serif" font-size="26" fill="#306998" font-weight="900">⚡</text>
      <text x="45" y="76" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="10" fill="#8e8e93">Python Launcher.app</text>
    </g>
    <!-- File 3: Install Certificates.command (HIGHLIGHTED) -->
    <g transform="translate(400,120)">
      <rect width="120" height="90" rx="8" fill="#0a84ff" opacity="0.25"/>
      <rect x="0" y="0" width="120" height="90" rx="8" fill="none" stroke="#0a84ff" stroke-width="2"/>
      <!-- Terminal script icon -->
      <rect x="20" y="12" width="80" height="54" rx="6" fill="#1c1c1e"/>
      <text x="60" y="50" text-anchor="middle" font-family="monospace,sans-serif" font-size="11" fill="#30d158">#!/bin/bash</text>
      <text x="60" y="82" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="10" fill="#60a5fa" font-weight="700">Install Certificates.command</text>
    </g>
    <!-- File 4: Update Shell Profile.command -->
    <g transform="translate(540,120)">
      <rect width="60" height="90" rx="8" fill="#2a2a2c"/>
      <!-- Terminal script icon small -->
      <rect x="8" y="12" width="44" height="34" rx="4" fill="#1c1c1e"/>
      <text x="30" y="35" text-anchor="middle" font-family="monospace,sans-serif" font-size="8" fill="#30d158">#!/bin</text>
      <text x="30" y="76" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="9" fill="#8e8e93">Update Shell Profile</text>
    </g>
    <!-- Second row -->
    <!-- ReadMe.rtf -->
    <g transform="translate(180,230)">
      <rect width="90" height="70" rx="8" fill="#2a2a2c"/>
      <rect x="15" y="10" width="60" height="40" rx="4" fill="#f5f5f0"/>
      <text x="45" y="36" text-anchor="middle" font-family="Georgia,serif" font-size="16" fill="#333" font-weight="700">RTF</text>
      <text x="45" y="60" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="11" fill="#8e8e93">ReadMe.rtf</text>
    </g>
    <!-- License.rtf -->
    <g transform="translate(290,230)">
      <rect width="90" height="70" rx="8" fill="#2a2a2c"/>
      <rect x="15" y="10" width="60" height="40" rx="4" fill="#f5f5f0"/>
      <text x="45" y="36" text-anchor="middle" font-family="Georgia,serif" font-size="14" fill="#333" font-weight="700">RTF</text>
      <text x="45" y="60" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="11" fill="#8e8e93">License.rtf</text>
    </g>
    <!-- Arrow pointing to Install Certificates -->
    <path d="M 442 215 L 442 230 L 415 240" stroke="#ff9f0a" stroke-width="2.5" fill="none" marker-end="url(#arr)" stroke-dasharray="4,3"/>
    <defs>
      <marker id="arr" markerWidth="8" markerHeight="8" refX="0" refY="3" orient="auto">
        <path d="M0,0 L0,6 L6,3 z" fill="#ff9f0a"/>
      </marker>
    </defs>
    <!-- Label for arrow -->
    <rect x="345" y="242" width="190" height="22" rx="4" fill="#ff9f0a" opacity="0.2"/>
    <text x="440" y="257" text-anchor="middle" font-family="-apple-system,Helvetica Neue,sans-serif" font-size="11.5" fill="#ff9f0a" font-weight="600">← 雙擊執行這個腳本！</text>
    <!-- Item count bar -->
    <rect x="152" y="368" width="468" height="32" fill="#252527"/>
    <line x1="152" y1="368" x2="620" y2="368" stroke="#3a3a3c" stroke-width="1"/>
    <text x="388" y="388" text-anchor="middle" font-family="-apple-system,Helvetica Neue,sans-serif" font-size="12" fill="#636366">6 個項目</text>
  </g>
  <rect x="0.5" y="0.5" width="619" height="399" rx="11.5" fill="none" stroke="#3a3a3c" stroke-width="1"/>
</svg>