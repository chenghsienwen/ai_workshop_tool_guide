<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Session 3：Excel AI Workshop — AI Workshop 手作步驟</title>
<style>
  :root {
    --bg: #0f1117;
    --surface: #1a1d27;
    --surface2: #22263a;
    --border: #2e3352;
    --accent: #6c63ff;
    --accent2: #00d4aa;
    --text: #e2e8f0;
    --muted: #94a3b8;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang TC', system-ui, sans-serif;
    line-height: 1.6;
    min-height: 100vh;
    padding: 2rem 1rem 4rem;
  }
  .wrap { max-width: 720px; margin: 0 auto; }
  .breadcrumb {
    display: flex; gap: .4rem; align-items: center;
    color: var(--muted); font-size: .85rem; margin-bottom: 2rem;
  }
  .breadcrumb a { color: var(--muted); text-decoration: none; }
  .breadcrumb a:hover { color: var(--text); }

  .hero { text-align: center; margin-bottom: 2.5rem; }
  .hero .emoji { font-size: 3rem; margin-bottom: .75rem; }
  .hero .tag {
    display: inline-block;
    font-size: .75rem; font-weight: 700;
    color: var(--accent2);
    letter-spacing: .05em;
    margin-bottom: .5rem;
  }
  .hero h1 { font-size: 1.75rem; font-weight: 800; color: #fff; margin-bottom: .5rem; }
  .hero p { color: var(--muted); font-size: 1rem; }

  .placeholder {
    background: var(--surface);
    border: 1px dashed var(--border);
    border-radius: 16px;
    padding: 3rem 1.5rem;
    text-align: center;
    color: var(--muted);
  }
  .placeholder .icon { font-size: 2rem; margin-bottom: .75rem; }
  .placeholder p { font-size: .9rem; }

  @media (max-width: 520px) {
    .hero h1 { font-size: 1.35rem; }
  }
</style>
</head>
<body>

<div class="wrap">
  <div class="breadcrumb">
    <a href="../../index.html">首頁</a>
    <span>/</span>
    <a href="../index.html">手作步驟</a>
    <span>/</span>
    <span>Session 3</span>
  </div>

  <div class="hero">
    <div class="emoji">📊</div>
    <span class="tag">SESSION 3</span>
    <h1>Excel AI Workshop</h1>
    <p>AI 輔助 Excel 實作</p>
  </div>

  <div class="placeholder">
    <div class="icon">🚧</div>
    <p>本場次手作步驟內容製作中，敬請期待。</p>
  </div>
</div>

</body>
</html>
