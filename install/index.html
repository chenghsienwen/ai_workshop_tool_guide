<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>安裝環境 — AI Workshop 工具安裝指南</title>
<style>
  :root {
    --bg: #0f1117;
    --surface: #1a1d27;
    --surface2: #22263a;
    --border: #2e3352;
    --accent: #6c63ff;
    --accent2: #00d4aa;
    --text: #e2e8f0;
    --muted: #94a3b8;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang TC', system-ui, sans-serif;
    line-height: 1.6;
    min-height: 100vh;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 2rem 1rem;
  }
  .back-link {
    position: absolute; top: 1.5rem; left: 1.5rem;
    color: var(--muted); text-decoration: none; font-size: .85rem;
  }
  .back-link:hover { color: var(--text); }

  .hero { text-align: center; margin-bottom: 2.5rem; }
  .hero .emoji { font-size: 3rem; margin-bottom: .75rem; }
  .hero h1 { font-size: 2rem; font-weight: 800; color: #fff; margin-bottom: .5rem; }
  .hero p { color: var(--muted); font-size: 1rem; }

  .picker {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1.25rem;
    width: 100%;
    max-width: 640px;
  }
  .picker-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 2rem 1.5rem;
    text-align: center;
    text-decoration: none;
    color: var(--text);
    transition: all .18s;
  }
  .picker-card:hover {
    border-color: var(--accent);
    transform: translateY(-2px);
    text-decoration: none;
  }
  .picker-card .icon { font-size: 2.75rem; margin-bottom: .75rem; }
  .picker-card h2 { font-size: 1.15rem; font-weight: 700; color: #fff; margin-bottom: .35rem; }
  .picker-card p { font-size: .85rem; color: var(--muted); }
  .picker-card .cta {
    display: inline-block; margin-top: 1rem;
    background: var(--accent); color: #fff;
    font-size: .85rem; font-weight: 600;
    padding: .5rem 1.2rem; border-radius: 999px;
  }

  @media (max-width: 520px) {
    .picker { grid-template-columns: 1fr; }
    .hero h1 { font-size: 1.5rem; }
    .back-link { position: static; display: block; margin-bottom: 1.5rem; }
  }
</style>
</head>
<body>

<a class="back-link" href="../index.html">← 返回首頁</a>

<div class="hero">
  <div class="emoji">🤖</div>
  <h1>安裝環境</h1>
  <p>請選擇你的作業系統，開始安裝 Workshop 所需的 AI CLI 工具</p>
</div>

<div class="picker">
  <a class="picker-card" href="windows.html">
    <div class="icon">🪟</div>
    <h2>Windows</h2>
    <p>適用 Windows 10/11</p>
    <span class="cta">開始安裝 →</span>
  </a>
  <a class="picker-card" href="macos.html">
    <div class="icon">🍎</div>
    <h2>macOS</h2>
    <p>Apple Silicon / Intel</p>
    <span class="cta">開始安裝 →</span>
  </a>
</div>

</body>
</html>
