<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 200" style="display:block;width:100%">
  <defs>
    <filter id="nshadow2"><feDropShadow dx="0" dy="4" stdDeviation="8" flood-opacity="0.45"/></filter>
    <clipPath id="acc"><rect x="60" y="30" width="360" height="140" rx="14"/></clipPath>
  </defs>
  <rect width="480" height="200" fill="#1a1a1a" opacity="0.7"/>
  <g filter="url(#nshadow2)">
    <rect x="60" y="30" width="360" height="140" rx="14" fill="#2d2d2f"/>
  </g>
  <g clip-path="url(#acc)">
    <rect x="60" y="30" width="360" height="140" fill="#2d2d2f"/>
    <rect x="60" y="30" width="6" height="140" fill="#ff3b30"/>
    <!-- Jamf Protect icon (shield simplified) -->
    <rect x="82" y="50" width="48" height="48" rx="8" fill="#1565c0"/>
    <text x="106" y="82" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="white">🛡️</text>
    <!-- Notification title -->
    <text x="144" y="68" font-family="-apple-system,Helvetica Neue,sans-serif" font-size="13.5" fill="#e2e2e7" font-weight="700">Jamf Protect</text>
    <!-- Notification body -->
    <text x="144" y="90" font-family="-apple-system,Helvetica Neue,sans-serif" font-size="12" fill="#c8c8cc">「agy」已被防止與網路連線。</text>
    <text x="144" y="108" font-family="-apple-system,Helvetica Neue,sans-serif" font-size="11.5" fill="#8e8e93">應用程式：~/.local/bin/agy</text>
    <text x="144" y="124" font-family="-apple-system,Helvetica Neue,sans-serif" font-size="11.5" fill="#8e8e93">原因：Network Policy 封鎖對外 API 連線。</text>
    <text x="400" y="52" text-anchor="end" font-family="-apple-system,Helvetica Neue,sans-serif" font-size="11" fill="#636366">剛才</text>
    <line x1="66" y1="148" x2="414" y2="148" stroke="#3a3a3c" stroke-width="1"/>
    <text x="240" y="163" text-anchor="middle" font-family="-apple-system,Helvetica Neue,sans-serif" font-size="11.5" fill="#636366">請聯繫 IT Help Desk 申請開放 agy 網路存取</text>
  </g>
  <rect x="60.5" y="30.5" width="359" height="139" rx="13.5" fill="none" stroke="#4a4a4c" stroke-width="1"/>
</svg>